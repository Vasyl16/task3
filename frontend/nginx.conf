server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # No API/WebSocket proxying here: the browser talks to the backend
  # directly on its published port via VITE_API_URL / VITE_WS_URL, and
  # the backend's CORS_ORIGIN allows this origin. Adding a proxy would
  # create a second, silently divergent way for requests to reach the
  # API depending on which launch mode is in use.

  location / {
    # SPA fallback — the router owns the URL space, so any unknown path
    # must return index.html rather than a 404.
    try_files $uri $uri/ /index.html;
  }

  # Vite emits content-hashed filenames, so these are safe to cache
  # forever; index.html must not be, or a deploy would never be picked up.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
